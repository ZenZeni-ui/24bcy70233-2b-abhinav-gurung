<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhinav Gurung</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <main class="banking-container">
      
      <div class="header">
        <div class="name">Abhinav Gurung</div>
        <div class="uid">UID: 24bcy70233</div>
      </div>

      
      <h1 id="balance-display" class="balance-display">Balance: $1000</h1>

     
      <form id="banking-form" class="banking-form">
        <div class="input-section">
          <label for="amount" class="input-label">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            class="input-field"
            placeholder="Enter amount"
            step="0.01"
          />
        </div>

        <div class="actions">
          <button
            id="deposit-btn"
            class="btn btn-deposit"
            type="button"
            onclick="handleDeposit()"
          >
            Deposit
          </button>
          <button
            id="withdraw-btn"
            class="btn btn-withdraw"
            type="button"
            onclick="handleWithdraw()"
          >
            Withdraw
          </button>
        </div>

        <p id="error-message" class="error-message">Invalid amount!</p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
